<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DailyQuotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>DailyQuotes</h1>
    <section class="quote-card">
      <p id="quote" class="quote">Laden...</p>
      <p id="author" class="author"></p>
      <p id="date" class="date"></p>
    </section>
    <p id="message" class="message"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    async function loadToday() {
      const today = new Date().toLocaleDateString("en-CA");
      document.getElementById("date").textContent =
        new Date().toLocaleDateString("nl-NL", {day:"numeric", month:"long", year:"numeric"});

      const { data, error } = await db
        .from("quotes")
        .select("quote, author")
        .eq("quote_date", today)
        .maybeSingle();

      if (error) {
        document.getElementById("quote").textContent = "Er ging iets mis.";
        document.getElementById("message").textContent = error.message;
        return;
      }

      if (!data) {
        document.getElementById("quote").textContent = "Er is vandaag nog geen quote.";
        document.getElementById("author").textContent = "";
        return;
      }

      document.getElementById("quote").textContent = `"${data.quote}"`;
      document.getElementById("author").textContent = data.author ? `— ${data.author}` : "";
    }

    loadToday();
  </script>
</body>
</html>
