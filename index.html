<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DailyQuotes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .quote-box {
            background: #1e1e1e;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .quote {
            font-size: 28px;
            line-height: 1.4;
            font-style: italic;
        }

        .author {
            margin-top: 25px;
            font-size: 18px;
            color: #aaa;
        }

        .date {
            margin-top: 15px;
            font-size: 14px;
            color: #777;
        }

        button {
            margin-top: 30px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DailyQuotes</h1>

        <div class="quote-box">

            <div class="quote" id="quote">
                "The only way to do great work is to love what you do."
            </div>

            <div class="author" id="author">
                — Steve Jobs
            </div>

            <div class="date" id="date"></div>

            <button onclick="newQuote()">
                Nieuwe quote
            </button>

        </div>

    </div>


    <script>

        const quotes = [
            {
                text: "The only way to do great work is to love what you do.",
                author: "Steve Jobs"
            },
            {
                text: "It always seems impossible until it's done.",
                author: "Nelson Mandela"
            },
            {
                text: "The future depends on what you do today.",
                author: "Mahatma Gandhi"
            },
            {
                text: "Stay hungry, stay foolish.",
                author: "Steve Jobs"
            }
        ];


        function newQuote() {

            const randomNumber = Math.floor(Math.random() * quotes.length);

            document.getElementById("quote").textContent =
                '"' + quotes[randomNumber].text + '"';

            document.getElementById("author").textContent =
                "— " + quotes[randomNumber].author;
        }


        // Datum van vandaag
        const today = new Date();

        document.getElementById("date").textContent =
            today.toLocaleDateString("nl-NL", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

    </script>

</body>
</html>
