<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DailyQuotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <nav class="top-nav">
      <a href="index.html">Today</a>
      <a href="archive.html">Archive</a>
      <a href="admin.html">Admin</a>
    </nav>

    <header class="hero">
      <p class="eyebrow">YOUR DAILY QUOTE</p>
      <h1>DailyQuotes</h1>
      <p class="subtitle">A little thought for every day.</p>
    </header>

    <section class="quote-card">
      <span id="category" class="category-badge"></span>
      <p id="quote" class="quote">Loading...</p>
      <p id="author" class="author"></p>
      <p id="date" class="date"></p>
    </section>

    <p id="message" class="message"></p>

    <section class="background-section">
      <p>Background</p>
      <div class="background-picker">
        <button onclick="changeBackground('backgrounds/mountains.jpeg')">🏔️ Mountains</button>
        <button onclick="changeBackground('backgrounds/forest.jpeg')">🌲 Forest</button>
        <button onclick="changeBackground('backgrounds/city.jpeg')">🌆 City</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function getToday() {
      return new Date().toLocaleDateString("en-CA");
    }

    function changeBackground(image) {
      document.body.style.backgroundImage =
        `linear-gradient(rgba(5, 12, 22, 0.35), rgba(5, 12, 22, 0.65)), url("${image}")`;
      localStorage.setItem("dailyquotes-background", image);
    }

    const savedBackground = localStorage.getItem("dailyquotes-background");
    if (savedBackground) changeBackground(savedBackground);

    async function loadToday() {
      const today = getToday();

      document.getElementById("date").textContent =
        new Date().toLocaleDateString("en-US", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });

      const { data, error } = await db
        .from("quotes")
        .select("quote, author, category")
        .eq("quote_date", today)
        .maybeSingle();

      if (error) {
        document.getElementById("quote").textContent = "Something went wrong.";
        document.getElementById("message").textContent = error.message;
        return;
      }

      if (!data) {
        document.getElementById("quote").textContent = "There is no quote for today yet.";
        document.getElementById("author").textContent = "";
        document.getElementById("category").textContent = "";
        return;
      }

      document.getElementById("quote").textContent = `"${data.quote}"`;
      document.getElementById("author").textContent =
        data.author ? `— ${data.author}` : "";
      document.getElementById("category").textContent =
        data.category || "Life";
    }

    loadToday();
  </script>
</body>
</html>
