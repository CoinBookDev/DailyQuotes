<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyQuotes Admin</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

<main class="container">

  <h1>DailyQuotes Admin</h1>

  <section id="loginBox" class="card">

    <h2>Log in</h2>

    <input id="email" type="email" placeholder="E-mail">

    <input id="password" type="password" placeholder="Password">

    <button id="loginButton">Log in</button>

    <p id="loginMessage"></p>

  </section>


  <section id="adminBox" class="card hidden">

    <h2>Add quote</h2>

    <label>Date</label>
    <input id="date" type="date">

    <label>Quote</label>
    <textarea id="quote" placeholder="Write your quote here..."></textarea>

    <label>Author</label>
    <input id="author" type="text" placeholder="For example: Albert Einstein">

    <label>Categorie</label>

<select id="category">
  <option value="Liefde">❤️ Liefde</option>
  <option value="Motivatie">💪 Motivatie</option>
  <option value="Film & Series">🎬 Film & Series</option>
  <option value="Muziek">🎵 Muziek</option>
  <option value="Boeken">📚 Boeken</option>
  <option value="Filosofie">🧠 Filosofie</option>
  <option value="Sad / 3AM">🌧️ Sad / 3AM</option>
  <option value="Funny">😂 Funny</option>
  <option value="Leven">🌟 Leven</option>
  <option value="Karakterquotes">🎭 Karakterquotes</option>
</select>

<button id="saveButton">Save quote</button>

<p id="saveMessage"></p>


<hr>

<h2>🌄 Achtergrond</h2>

<p>Kies een achtergrond:</p>

<div class="background-picker">

  <button onclick="changeBackground('backgrounds/mountains.jpeg')">
    🏔️ Bergen
  </button>

  <button onclick="changeBackground('backgrounds/forest.jpeg')">
    🌲 Bos
  </button>

  <button onclick="changeBackground('backgrounds/city.jpeg')">
    🌆 Stad
  </button>

<button onclick="document.body.style.backgroundImage = 'url(backgrounds/mountains.jpeg)'">
  🏔️ Bergen
</button>
</div>


<hr>

<h2>Planned quotes</h2>

    <div id="quoteList">
      Loading...
    </div>

    <button id="logoutButton">Log out</button>

  </section>

</main>


<script>

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const category = document.getElementById("category");
const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");

const email = document.getElementById("email");
const password = document.getElementById("password");

const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");

const loginMessage = document.getElementById("loginMessage");

const date = document.getElementById("date");
const quote = document.getElementById("quote");
const author = document.getElementById("author");

const saveButton = document.getElementById("saveButton");
const saveMessage = document.getElementById("saveMessage");

const quoteList = document.getElementById("quoteList");


function showAdmin() {

  loginBox.classList.add("hidden");
  adminBox.classList.remove("hidden");

}


function showLogin() {

  loginBox.classList.remove("hidden");
  adminBox.classList.add("hidden");

}


loginButton.addEventListener("click", async () => {

  loginMessage.textContent = "Inloggen...";

  const { data, error } = await db.auth.signInWithPassword({

    email: email.value.trim(),
    password: password.value

  });


  if (error) {

    loginMessage.textContent = "Fout: " + error.message;

    return;

  }


  if (!data.session) {

    loginMessage.textContent =
      "Login gelukt, maar er is geen sessie ontvangen.";

    return;

  }


  loginMessage.textContent = "";

  showAdmin();

  await loadQuotes();

});


logoutButton.addEventListener("click", async () => {

  await db.auth.signOut();

  showLogin();

});


saveButton.addEventListener("click", async () => {

  const selectedDate = date.value;
  const selectedQuote = quote.value.trim();
  const selectedAuthor = author.value.trim();
  const selectedCategory = category.value;


  if (!selectedDate || !selectedQuote) {

    saveMessage.textContent =
      "Vul een datum en quote in.";

    return;

  }


  saveMessage.textContent = "Opslaan...";


  const { error } = await db
  .from("quotes")
  .upsert(
    {
      quote_date: selectedDate,
      quote: selectedQuote,
      author: selectedAuthor || null,
      category: selectedCategory
    },
    {
      onConflict: "quote_date"
    }
  );


  if (error) {

    saveMessage.textContent =
      "Fout: " + error.message;

    return;

  }


  saveMessage.textContent = "Quote opgeslagen!";

  quote.value = "";
  author.value = "";

  await loadQuotes();

});


async function loadQuotes() {

  quoteList.textContent = "Quotes laden...";


  const { data, error } = await db
    .from("quotes")
    .select("quote_date, quote, author")
    .order("quote_date", { ascending: true });


  if (error) {

    quoteList.textContent =
      "Fout bij laden: " + error.message;

    return;

  }


  if (!data || data.length === 0) {

    quoteList.textContent =
      "Er zijn nog geen quotes.";

    return;

  }


  quoteList.innerHTML = "";


  data.forEach(item => {

    const row = document.createElement("div");

    row.className = "quote-row";


    row.innerHTML = `
      <strong>${formatDate(item.quote_date)}</strong>
      <br>
      "${escapeHTML(item.quote)}"
      <br>
      <small>
        ${item.author ? "— " + escapeHTML(item.author) : ""}
      </small>
      <br><br>
      <button onclick="deleteQuote('${item.quote_date}')">
        Verwijderen
      </button>
      <hr>
    `;


    quoteList.appendChild(row);

  });

}


async function deleteQuote(selectedDate) {

  if (!confirm("Deze quote verwijderen?")) {

    return;

  }


  const { error } = await db
    .from("quotes")
    .delete()
    .eq("quote_date", selectedDate);


  if (error) {

    alert("Fout: " + error.message);

    return;

  }


  await loadQuotes();

}


async function start() {

  const { data, error } =
    await db.auth.getSession();


  if (error) {

    loginMessage.textContent =
      "Fout bij controleren van login: " +
      error.message;

    return;

  }


  if (data.session) {

    showAdmin();

    await loadQuotes();

  } else {

    showLogin();

  }

}


function formatDate(value) {

  return new Date(
    value + "T00:00:00"
  ).toLocaleDateString(
    "nl-NL",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


function escapeHTML(value) {

  return String(value).replace(
    /[&<>"']/g,

    function(character) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character];

    }

  );

}


start();

  function changeBackground(image) {

  document.body.style.backgroundImage =
    `linear-gradient(rgba(5, 12, 22, 0.35), rgba(5, 12, 22, 0.65)), url("${image}")`;

  localStorage.setItem(
    "dailyquotes-background",
    image
  );
}


const savedBackground =
  localStorage.getItem("dailyquotes-background");

if (savedBackground) {

  document.body.style.backgroundImage =
    `linear-gradient(rgba(5, 12, 22, 0.35), rgba(5, 12, 22, 0.65)), url("${savedBackground}")`;

}

</script>

</body>
</html>
