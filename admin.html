<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyQuotes Admin Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

<h1>Supabase test</h1>

<p id="result">Test wordt uitgevoerd...</p>

<script>

const result = document.getElementById("result");

alert("1. Supabase is geladen");

if (typeof SUPABASE_URL === "undefined") {

    result.textContent = "❌ SUPABASE_URL bestaat niet";
    alert("2. SUPABASE_URL ontbreekt");

} else {

    result.textContent = "✅ SUPABASE_URL gevonden";
    alert("2. SUPABASE_URL is gevonden");

}

if (typeof SUPABASE_PUBLISHABLE_KEY === "undefined") {

    result.textContent += " | ❌ Key ontbreekt";
    alert("3. PUBLISHABLE KEY ontbreekt");

} else {

    result.textContent += " | ✅ Key gevonden";
    alert("3. PUBLISHABLE KEY is gevonden");

}

</script>

</body>
</html>
