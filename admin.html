<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyQuotes Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
.admin-header{margin-bottom:28px}
.admin-kicker{margin:0 0 2px;font-size:.85rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.72}
.admin-header h1{margin:0}
.admin-subtitle{margin:4px 0 0;opacity:.72}
.quote-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.quote-header h2{margin:0}
.quote-header select{width:auto!important;min-width:150px;max-width:210px;margin:0}
.form-buttons{display:flex;gap:10px;flex-wrap:wrap}
.quote-row .delete-button{background:#dc2626!important;color:#fff!important;border-color:#b91c1c!important}
.quote-row .delete-button:hover{background:#b91c1c!important}
</style>
</head>
<body>
<main class="container">
<header class="admin-header">
<p class="admin-kicker">Management</p>
<h1>DailyQuotes Admin</h1>
<p class="admin-subtitle">Create and manage your daily quotes.</p>
</header>

<section id="loginBox" class="card">
<h2>Log in</h2>
<input id="email" type="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Password">
<button id="loginButton">Log in</button>
<p id="loginMessage"></p>
</section>

<section id="adminBox" class="card hidden">
<div class="quote-header">
<h2 id="formTitle">Add quote</h2>
<select id="category" aria-label="Category">
<option value="Love">❤️ Love</option>
<option value="Motivation">💪 Motivation</option>
<option value="Film & Series">🎬 Film & Series</option>
<option value="Music">🎵 Music</option>
<option value="Books">📚 Books</option>
<option value="Philosophy">🧠 Philosophy</option>
<option value="Sad / 3AM">🌧️ Sad / 3AM</option>
<option value="Funny">😂 Funny</option>
<option value="Life">🌟 Life</option>
<option value="Character Quotes">🎭 Character Quotes</option>
</select>
</div>

<label for="date">Date</label>
<input id="date" type="date">

<label for="quote">Quote</label>
<textarea id="quote" placeholder="Write your quote here..."></textarea>

<label for="author">Author</label>
<input id="author" type="text" placeholder="For example: Albert Einstein">

<div class="form-buttons">
<button id="saveButton">Save quote</button>
<button id="cancelEditButton" class="hidden" type="button">Cancel</button>
</div>
<p id="saveMessage"></p>



<hr>

<h2>📸 Media</h2>
<p class="muted">Post photos or videos to the public Media feed. Only logged-in admins can upload or delete posts.</p>

<label for="mediaFile">Photo or video</label>
<input id="mediaFile" type="file" accept="image/*,video/mp4,video/webm,video/ogg">

<img id="mediaPreview" class="media-upload-preview" alt="Media preview">

<label for="mediaCaption">Caption</label>
<textarea id="mediaCaption" placeholder="Write a caption (optional)..."></textarea>

<button id="uploadMediaButton" type="button">Post media</button>
<p id="mediaMessage" class="message"></p>

<h3>Existing media</h3>
<div id="mediaAdminList" class="media-admin-list">Loading...</div>

<hr>

<h2>🌄 Background</h2>
<p>Choose a background:</p>
<div class="background-picker">
<button onclick="changeBackground('backgrounds/mountains.jpg')">🏔️ Mountains</button>
<button onclick="changeBackground('backgrounds/forest.jpg')">🌲 Forest</button>
<button onclick="changeBackground('backgrounds/city.jpg')">🌆 City</button>
<button onclick="changeBackground('backgrounds/StarrySky.jpg')">Starry sky</button>
</div>

<hr>

<h2>Planned quotes</h2>
<div id="quoteList">Loading...</div>
<button id="logoutButton">Log out</button>
</section>
</main>

<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const loginBox=document.getElementById("loginBox");
const adminBox=document.getElementById("adminBox");
const email=document.getElementById("email");
const password=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const logoutButton=document.getElementById("logoutButton");
const loginMessage=document.getElementById("loginMessage");
const date=document.getElementById("date");
const quote=document.getElementById("quote");
const author=document.getElementById("author");
const category=document.getElementById("category");
const saveButton=document.getElementById("saveButton");
const cancelEditButton=document.getElementById("cancelEditButton");
const saveMessage=document.getElementById("saveMessage");
const quoteList=document.getElementById("quoteList");
const formTitle=document.getElementById("formTitle");
let editingDate=null;

function showAdmin(){loginBox.classList.add("hidden");adminBox.classList.remove("hidden")}
function showLogin(){loginBox.classList.remove("hidden");adminBox.classList.add("hidden")}

loginButton.addEventListener("click",async()=>{
loginMessage.textContent="Logging in...";
const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});
if(error){loginMessage.textContent="Error: "+error.message;return}
if(!data.session){loginMessage.textContent="Login succeeded, but no session was received.";return}
loginMessage.textContent="";showAdmin();await loadQuotes();await loadMediaAdmin();
});

logoutButton.addEventListener("click",async()=>{await db.auth.signOut();resetForm();showLogin()});

saveButton.addEventListener("click",async()=>{
const selectedDate=date.value,selectedQuote=quote.value.trim(),selectedAuthor=author.value.trim(),selectedCategory=category.value;
if(!selectedDate||!selectedQuote){saveMessage.textContent="Please enter a date and quote.";return}
saveMessage.textContent=editingDate?"Updating...":"Saving...";
const {error}=await db.from("quotes").upsert({quote_date:selectedDate,quote:selectedQuote,author:selectedAuthor||null,category:selectedCategory},{onConflict:"quote_date"});
if(error){saveMessage.textContent="Error: "+error.message;return}
if(editingDate&&editingDate!==selectedDate){
const {error:deleteError}=await db.from("quotes").delete().eq("quote_date",editingDate);
if(deleteError){saveMessage.textContent="Saved, but the old date could not be removed: "+deleteError.message;return}
}
saveMessage.textContent=editingDate?"Quote updated!":"Quote saved!";
resetForm(false);await loadQuotes();
});

cancelEditButton.addEventListener("click",()=>resetForm());

async function editQuote(selectedDate){
const {data,error}=await db.from("quotes").select("quote_date,quote,author,category").eq("quote_date",selectedDate).single();
if(error){alert("Error: "+error.message);return}
editingDate=selectedDate;
formTitle.textContent="Edit quote";
saveButton.textContent="Update quote";
cancelEditButton.classList.remove("hidden");
date.value=data.quote_date;
quote.value=data.quote||"";
author.value=data.author||"";
category.value=data.category||"Life";
window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteQuote(selectedDate){
if(!confirm("Delete this quote?"))return;
const {error}=await db.from("quotes").delete().eq("quote_date",selectedDate);
if(error){alert("Error: "+error.message);return}
await loadQuotes();
}

async function loadQuotes(){
quoteList.textContent="Loading quotes...";
const today = new Date().toLocaleDateString("en-CA");

const {data,error}=await db
  .from("quotes")
  .select("quote_date,quote,author,category")
  .gte("quote_date", today)
  .order("quote_date",{ascending:true});
if(error){quoteList.textContent="Error loading quotes: "+error.message;return}
if(!data||data.length===0){quoteList.textContent="There are no quotes yet.";return}
quoteList.innerHTML="";
data.forEach(item=>{
const row=document.createElement("div");
row.className="quote-row";
row.innerHTML=`
<strong>${formatDate(item.quote_date)}</strong><br>
"${escapeHTML(item.quote)}"<br>
<small>${item.author?"— "+escapeHTML(item.author):""}</small><br>
<small>${item.category?escapeHTML(item.category):""}</small><br><br>
<button class="edit-button" onclick="editQuote('${item.quote_date}')">Edit</button>
<button class="delete-button" onclick="deleteQuote('${item.quote_date}')">Delete</button>
<hr>`;
quoteList.appendChild(row);
});
}

function resetForm(clearMessage=true){
editingDate=null;
formTitle.textContent="Add quote";
saveButton.textContent="Save quote";
cancelEditButton.classList.add("hidden");
date.value="";quote.value="";author.value="";category.value="Life";
if(clearMessage)saveMessage.textContent="";
}

function formatDate(value){return new Date(value+"T00:00:00").toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"})}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function changeBackground(image){
document.body.style.backgroundImage=`linear-gradient(rgba(5,12,22,.35),rgba(5,12,22,.65)),url("${image}")`;
localStorage.setItem("dailyquotes-background",image);
}
const savedBackground=localStorage.getItem("dailyquotes-background");
if(savedBackground)document.body.style.backgroundImage=`linear-gradient(rgba(5,12,22,.35),rgba(5,12,22,.65)),url("${savedBackground}")`;


const mediaFile = document.getElementById("mediaFile");
const mediaCaption = document.getElementById("mediaCaption");
const mediaPreview = document.getElementById("mediaPreview");
const uploadMediaButton = document.getElementById("uploadMediaButton");
const mediaMessage = document.getElementById("mediaMessage");
const mediaAdminList = document.getElementById("mediaAdminList");

mediaFile.addEventListener("change", () => {
  const file = mediaFile.files[0];
  if (!file) {
    mediaPreview.style.display = "none";
    mediaPreview.removeAttribute("src");
    return;
  }
  if (file.type.startsWith("image/")) {
    mediaPreview.src = URL.createObjectURL(file);
    mediaPreview.style.display = "block";
  } else {
    mediaPreview.style.display = "none";
  }
});

async function loadMediaAdmin() {
  mediaAdminList.textContent = "Loading...";

  const {data, error} = await db
    .from("media_posts")
    .select("id, media_type, storage_path, caption, created_at")
    .order("created_at", {ascending:false});

  if (error) {
    mediaAdminList.textContent = "Error loading media: " + error.message;
    return;
  }

  if (!data?.length) {
    mediaAdminList.textContent = "No media posts yet.";
    return;
  }

  mediaAdminList.innerHTML = "";

  data.forEach(post => {
    const {data:urlData} = db.storage.from("media").getPublicUrl(post.storage_path);
    const row = document.createElement("div");
    row.className = "media-admin-row";

    const media = post.media_type === "video"
      ? document.createElement("video")
      : document.createElement("img");

    media.src = urlData.publicUrl;
    if (post.media_type === "video") {
      media.controls = true;
      media.preload = "metadata";
    }

    const info = document.createElement("div");
    info.className = "media-admin-info";
    info.innerHTML = `<strong>${escapeHTML(post.caption || "Untitled post")}</strong>
      <small>${new Date(post.created_at).toLocaleString()}</small>`;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "delete-button";
    button.textContent = "Delete";
    button.addEventListener("click", () => deleteMedia(post));

    row.append(media, info, button);
    mediaAdminList.appendChild(row);
  });
}

async function uploadMedia() {
  const file = mediaFile.files[0];
  if (!file) {
    mediaMessage.textContent = "Please choose an image or video.";
    return;
  }

  if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
    mediaMessage.textContent = "Only image and video files are allowed.";
    return;
  }

  const {data:{user}} = await db.auth.getUser();
  if (!user) {
    mediaMessage.textContent = "You must be logged in as an admin.";
    return;
  }

  uploadMediaButton.disabled = true;
  mediaMessage.textContent = "Uploading...";

  const extension = (file.name.split(".").pop() || "bin").toLowerCase();
  const path = `${user.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;
  const mediaType = file.type.startsWith("video/") ? "video" : "image";

  const {error:uploadError} = await db.storage
    .from("media")
    .upload(path, file, {upsert:false, contentType:file.type});

  if (uploadError) {
    mediaMessage.textContent = "Upload failed: " + uploadError.message;
    uploadMediaButton.disabled = false;
    return;
  }

  const {error:insertError} = await db.from("media_posts").insert({
    media_type: mediaType,
    storage_path: path,
    caption: mediaCaption.value.trim()
  });

  if (insertError) {
    await db.storage.from("media").remove([path]);
    mediaMessage.textContent = "Could not create the post: " + insertError.message;
    uploadMediaButton.disabled = false;
    return;
  }

  mediaMessage.textContent = "Media posted!";
  mediaFile.value = "";
  mediaCaption.value = "";
  mediaPreview.style.display = "none";
  uploadMediaButton.disabled = false;
  await loadMediaAdmin();
}

async function deleteMedia(post) {
  if (!confirm("Delete this media post?")) return;

  const {error:storageError} = await db.storage
    .from("media")
    .remove([post.storage_path]);

  if (storageError) {
    alert("Could not delete the media file: " + storageError.message);
    return;
  }

  const {error:dbError} = await db
    .from("media_posts")
    .delete()
    .eq("id", post.id);

  if (dbError) {
    alert("The file was deleted, but the post could not be removed: " + dbError.message);
    return;
  }

  await loadMediaAdmin();
}

uploadMediaButton.addEventListener("click", uploadMedia);

async function start(){
const {data,error}=await db.auth.getSession();
if(error){loginMessage.textContent="Error checking login: "+error.message;return}
if(data.session){showAdmin();await loadQuotes();await loadMediaAdmin()}else showLogin();
}
start();
</script>
</body>
</html>
