<body>

<nav>
...
</nav>

<main class="container">

    <!-- LOGIN -->

    <section id="loginBox" class="card">

        <h2>Admin Login</h2>

        <input
            id="email"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button id="loginButton">
            Log In
        </button>

        <p id="loginMessage"></p>

    </section>


    <!-- ADMIN -->

    <section id="adminBox" class="hidden">

        <aside class="sidebar">

            <h2>DailyQuotes</h2>

            <button onclick="showPanel('dashboardPanel')">
                📊 Dashboard
            </button>

            <button onclick="showPanel('quotesPanel')">
                📝 Quotes
            </button>

            <button onclick="showPanel('mediaPanel')">
                📸 Media
            </button>

            <button onclick="showPanel('backgroundPanel')">
                🌄 Backgrounds
            </button>

            <button onclick="showPanel('announcementPanel')">
                📢 Announcements
            </button>

            <button id="logoutButton">
                🚪 Logout
            </button>

        </aside>

        <div class="content">

            <!-- dashboard -->

            <section id="dashboardPanel"
                     class="panel">

            </section>

            <!-- quotes -->

            <section id="quotesPanel"
                     class="panel hidden">

            </section>

            <!-- media -->

            <section id="mediaPanel"
                     class="panel hidden">

            </section>

            <!-- backgrounds -->

            <section id="backgroundPanel"
                     class="panel hidden">

            </section>

            <!-- announcements -->

            <section id="announcementPanel"
                     class="panel hidden">

            </section>

        </div>

    </section>

</main>

</body>
<section id="dashboardPanel" class="panel">

<h2>Dashboard</h2>

<div class="stats-grid">

    <div class="card">
        <h3>Total Quotes</h3>
        <p id="quoteCount">
            Loading...
        </p>
    </div>

    <div class="card">
        <h3>Total Media</h3>
        <p id="mediaCount">
            Loading...
        </p>
    </div>

    <div class="card">
        <h3>Next Quote</h3>
        <p id="nextQuote">
            Loading...
        </p>
    </div>

</div>

</section>
<section id="quotesPanel"
         class="panel hidden">

<h2>Add Quote</h2>

<input type="date"
       id="date">

<textarea
    id="quote">
</textarea>

<input
    id="author">

<select id="category">

<option>Love</option>
<option>Life</option>

</select>

<button id="saveButton">
Save Quote
</button>

<hr>

<div id="quoteList">
</div>

</section>
<section id="mediaPanel"
         class="panel hidden">

<h2>Media</h2>

<input
    type="file"
    id="mediaFile">

<textarea
    id="mediaCaption">
</textarea>

<button
    id="uploadMediaButton">

Post Media

</button>

<div id="mediaAdminList">

</div>

</section>
<section id="backgroundPanel"
         class="panel hidden">

<h2>Backgrounds</h2>

<div class="background-grid">

<button>
🏔️ Mountains
</button>

<button>
🌲 Forest
</button>

<button>
🌆 City
</button>

<button>
🌌 Starry Sky
</button>

</div>

</section>
<section id="announcementPanel"
         class="panel hidden">

<h2>Announcement</h2>

<input
    id="announcementTitle"
    placeholder="Title">

<textarea
    id="announcementText"
    placeholder="Message">
</textarea>

<label>

<input
 type="checkbox"
 id="announcementActive">

Active

</label>

<button
 id="saveAnnouncement">

Save

</button>

</section>
<aside class="sidebar">

<h2>DailyQuotes</h2>

<button
onclick="showPanel('dashboardPanel')">

📊 Dashboard

</button>

<button
onclick="showPanel('quotesPanel')">

📝 Quotes

</button>

<button
onclick="showPanel('mediaPanel')">

📸 Media

</button>

<button
onclick="showPanel('backgroundPanel')">

🌄 Backgrounds

</button>

<button
onclick="showPanel('announcementPanel')">

📢 Announcements

</button>

<button id="logoutButton">

🚪 Logout

</button>

</aside>
