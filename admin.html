<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyQuotes Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<main class="container">
  <nav class="top-nav">
    <a href="index.html">Today</a>
    <a href="archive.html">Archive</a>
    <a href="admin.html" class="active">Admin</a>
  </nav>

  <header class="hero compact-hero">
    <p class="eyebrow">MANAGEMENT</p>
    <h1>DailyQuotes Admin</h1>
    <p class="subtitle">Create and manage your daily quotes.</p>
  </header>

  <section id="loginBox" class="card">
    <h2>Log in</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password">

    <button id="loginButton">Log in</button>
    <p id="loginMessage" class="message"></p>
  </section>

  <section id="adminBox" class="card hidden">
    <h2>Add or update a quote</h2>

    <label for="date">Date</label>
    <input id="date" type="date">

    <label for="quote">Quote</label>
    <textarea id="quote" placeholder="Write your quote here..."></textarea>

    <label for="author">Author</label>
    <input id="author" type="text" placeholder="For example: Albert Einstein">

    <label for="category">Category</label>
    <select id="category">
      <option value="Love">❤️ Love</option>
      <option value="Motivation">💪 Motivation</option>
      <option value="Film & Series">🎬 Film & Series</option>
      <option value="Music">🎵 Music</option>
      <option value="Books">📚 Books</option>
      <option value="Philosophy">🧠 Philosophy</option>
      <option value="Sad / 3AM">🌧️ Sad / 3AM</option>
      <option value="Funny">😂 Funny</option>
      <option value="Life" selected>🌟 Life</option>
      <option value="Character Quotes">🎭 Character Quotes</option>
    </select>

    <button id="saveButton">Save quote</button>
    <button id="cancelEditButton" class="hidden" type="button">Cancel edit</button>
    <p id="saveMessage" class="message"></p>

    <hr>

    <h2>Background</h2>
    <p class="muted">Choose a background for this browser.</p>

    <div class="background-picker">
      <button onclick="changeBackground('backgrounds/mountains.jpg')">🏔️ Mountains</button>
      <button onclick="changeBackground('backgrounds/forest.jpg')">🌲 Forest</button>
      <button onclick="changeBackground('backgrounds/city.jpg')">🌆 City</button>
    </div>

    <hr>

    <h2>Planned quotes</h2>
    <p class="muted">Only future quotes are shown here.</p>

    <div id="quoteList">Loading...</div>

    <button id="logoutButton" class="secondary-button">Log out</button>
  </section>
</main>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const loginBox = document.getElementById("loginBox");
const adminBox = document.getElementById("adminBox");
const email = document.getElementById("email");
const password = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const loginMessage = document.getElementById("loginMessage");
const date = document.getElementById("date");
const quote = document.getElementById("quote");
const author = document.getElementById("author");
const category = document.getElementById("category");
const saveButton = document.getElementById("saveButton");
const saveMessage = document.getElementById("saveMessage");
const cancelEditButton = document.getElementById("cancelEditButton");
let editingDate = null;
const quoteList = document.getElementById("quoteList");

function getToday() {
  return new Date().toLocaleDateString("en-CA");
}

function showAdmin() {
  loginBox.classList.add("hidden");
  adminBox.classList.remove("hidden");
}

function showLogin() {
  loginBox.classList.remove("hidden");
  adminBox.classList.add("hidden");
}

function formatDate(value) {
  return new Date(value + "T00:00:00").toLocaleDateString("en-US", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[character]));
}

function changeBackground(image) {
  document.body.style.backgroundImage =
    `linear-gradient(rgba(5, 12, 22, 0.35), rgba(5, 12, 22, 0.65)), url("${image}")`;
  localStorage.setItem("dailyquotes-background", image);
}

const savedBackground = localStorage.getItem("dailyquotes-background");
if (savedBackground) changeBackground(savedBackground);

loginButton.addEventListener("click", async () => {
  loginMessage.textContent = "Logging in...";

  const { data, error } = await db.auth.signInWithPassword({
    email: email.value.trim(),
    password: password.value
  });

  if (error) {
    loginMessage.textContent = "Error: " + error.message;
    return;
  }

  if (!data.session) {
    loginMessage.textContent = "Login succeeded, but no session was received.";
    return;
  }

  loginMessage.textContent = "";
  showAdmin();
  await loadQuotes();
});

logoutButton.addEventListener("click", async () => {
  await db.auth.signOut();
  showLogin();
});

saveButton.addEventListener("click", async () => {
  const selectedDate = date.value;
  const selectedQuote = quote.value.trim();
  const selectedAuthor = author.value.trim();
  const selectedCategory = category.value;

  if (!selectedDate || !selectedQuote) {
    saveMessage.textContent = "Please enter a date and quote.";
    return;
  }

  saveMessage.textContent = editingDate ? "Updating..." : "Saving...";

  const { error } = await db
    .from("quotes")
    .upsert({
      quote_date: selectedDate,
      quote: selectedQuote,
      author: selectedAuthor || null,
      category: selectedCategory
    }, {
      onConflict: "quote_date"
    });

  if (error) {
    saveMessage.textContent = "Error: " + error.message;
    return;
  }

  saveMessage.textContent = editingDate ? "Quote updated!" : "Quote saved!";
  quote.value = "";
  author.value = "";
  editingDate = null;
  saveButton.textContent = "Save quote";
  cancelEditButton.classList.add("hidden");
  await loadQuotes();
});

async function loadQuotes() {
  quoteList.textContent = "Loading planned quotes...";

  const { data, error } = await db
    .from("quotes")
    .select("quote_date, quote, author, category")
    .gt("quote_date", getToday())
    .order("quote_date", { ascending: true });

  if (error) {
    quoteList.textContent = "Error loading quotes: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    quoteList.innerHTML = '<div class="empty-state">No quotes are currently planned.</div>';
    return;
  }

  quoteList.innerHTML = "";

  data.forEach(item => {
    const row = document.createElement("div");
    row.className = "quote-row";

    row.innerHTML = `
      <div class="quote-row-top">
        <strong>${formatDate(item.quote_date)}</strong>
        <span class="category-badge">${escapeHTML(item.category || "Life")}</span>
      </div>
      <p class="planned-quote">"${escapeHTML(item.quote)}"</p>
      <small>${item.author ? "— " + escapeHTML(item.author) : ""}</small>
      <br><br>
      <button onclick="editQuote('${item.quote_date}')">
        Edit
      </button>
      <button class="danger-button" onclick="deleteQuote('${item.quote_date}')">
        Delete
      </button>
    `;

    quoteList.appendChild(row);
  });
}


async function editQuote(selectedDate) {
  const { data, error } = await db
    .from("quotes")
    .select("quote_date, quote, author, category")
    .eq("quote_date", selectedDate)
    .maybeSingle();

  if (error || !data) {
    alert(error ? "Error: " + error.message : "Quote not found.");
    return;
  }

  editingDate = data.quote_date;
  date.value = data.quote_date;
  quote.value = data.quote || "";
  author.value = data.author || "";
  category.value = data.category || category.value;

  saveButton.textContent = "Update quote";
  cancelEditButton.classList.remove("hidden");
  saveMessage.textContent = "Editing quote from " + formatDate(data.quote_date);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

cancelEditButton.addEventListener("click", () => {
  editingDate = null;
  date.value = "";
  quote.value = "";
  author.value = "";
  saveButton.textContent = "Save quote";
  cancelEditButton.classList.add("hidden");
  saveMessage.textContent = "";
});

async function deleteQuote(selectedDate) {
  if (!confirm("Delete this quote?")) return;

  const { error } = await db
    .from("quotes")
    .delete()
    .eq("quote_date", selectedDate);

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  await loadQuotes();
}

async function start() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    loginMessage.textContent = "Error checking login: " + error.message;
    return;
  }

  if (data.session) {
    showAdmin();
    await loadQuotes();
  } else {
    showLogin();
  }
}

start();
</script>
</body>
</html>
