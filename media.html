<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Media | DailyQuotes</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><nav class="top-nav"><a href="index.html">Today</a><a href="archive.html">Archive</a><a href="media.html" class="active">Media</a><a href="admin.html">Admin</a></nav><header class="hero"><p class="eyebrow">DAILYQUOTES MEDIA</p><h1>Media Feed</h1><p class="subtitle">Photos and videos from DailyQuotes.</p></header><div id="mediaFeed"></div></main><script>async function loadMedia(){const r=await fetch('media.json');const posts=await r.json();const feed=document.getElementById('mediaFeed');posts.reverse().forEach(post=>{const card=document.createElement('div');card.className='media-card';card.innerHTML=post.type==='image'?`<img src="${post.src}" alt=""><div class="media-content"><p>${post.caption}</p><span>${post.date}</span></div>`:`<video controls><source src="${post.src}" type="video/mp4"></video><div class="media-content"><p>${post.caption}</p><span>${post.date}</span></div>`;feed.appendChild(card);});}loadMedia();</script></body></html>
