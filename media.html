<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media | DailyQuotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <nav class="top-nav">
    <a href="index.html">Today</a>
    <a href="archive.html">Archive</a>
    <a href="media.html" class="active">Media</a>
    <a href="admin.html">Admin</a>
  </nav>

  <header class="hero">
    <p class="eyebrow">DAILYQUOTES MEDIA</p>
    <h1>Media Feed</h1>
    <p class="subtitle">Photos and videos from DailyQuotes.</p>
  </header>

  <div id="mediaFeed">
    <p class="message">Loading media...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function loadMedia() {
  const feed = document.getElementById("mediaFeed");

  const { data, error } = await db
    .from("media_posts")
    .select("id, media_type, storage_path, caption, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    feed.innerHTML = `<p class="message">Error loading media: ${escapeHTML(error.message)}</p>`;
    return;
  }

  if (!data?.length) {
    feed.innerHTML = '<div class="card empty-state">No media posts yet.</div>';
    return;
  }

  feed.innerHTML = data.map(post => {
    const { data: urlData } = db.storage.from("media").getPublicUrl(post.storage_path);
    const url = urlData.publicUrl;
    const date = new Date(post.created_at).toLocaleDateString("en-US", {
      day:"numeric", month:"long", year:"numeric"
    });

    const media = post.media_type === "video"
      ? `<video controls preload="metadata"><source src="${escapeHTML(url)}" type="video/mp4">Your browser does not support video.</video>`
      : `<img src="${escapeHTML(url)}" alt="${escapeHTML(post.caption || "DailyQuotes media")}">`;

    return `<article class="media-card">
      ${media}
      <div class="media-content">
        ${post.caption ? `<p>${escapeHTML(post.caption)}</p>` : ""}
        <span>${date}</span>
      </div>
    </article>`;
  }).join("");
}

loadMedia();
</script>
</body>
</html>
