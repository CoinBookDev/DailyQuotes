<!DOCTYPE html>
<html>

<head>
    <title>World</title>
    style.css
</head>

<body>

<div class="daily-world-card">
    <h1>🌍 Daily World Quote</h1>
    <h2 id="dailyCountry"></h2>
    <p id="dailyQuote"></p>
</div>

<div class="world-controls">
    <input
        type="text"
        id="countrySearch"
        placeholder="Search countries..."
    >

    <button id="randomCountryBtn">
        🎲 Random Country
    </button>
</div>

<div class="progress-card">
    <h3>Countries Discovered</h3>
    <p id="discoveryProgress">0 / 5</p>
</div>

<div id="countriesContainer"></div>
<div id="countryInfo"></div>

world.jsscript>

</body>
</html>
